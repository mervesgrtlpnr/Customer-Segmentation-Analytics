<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ticaret Müşteri Segmentasyonu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #fff;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: #f39c12;
            box-shadow: 0 0 0 0.25rem rgba(243, 156, 18, 0.25);
        }
        .btn-custom {
            background: linear-gradient(45deg, #f1c40f, #e67e22);
            border: none;
            color: white;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
            color: white;
        }
        #resultCard {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="text-center mb-4">
                    <h2><i class="fa-solid fa-chart-pie text-warning"></i> E-Ticaret RFM Analizi</h2>
                    <p class="text-light opacity-75">Müşteri alışveriş metriklerini girerek segmentini analiz edin.</p>
                </div>

                <div class="glass-card mb-4">
                    <form id="predictionForm">
                        <div class="row g-4">
                            <div class="col-md-12">
                                <label class="form-label">Recency (Kaç Gün Önce Geldi?)</label>
                                <input type="number" class="form-control" id="Recency" required placeholder="Örn: 15">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Frequency (Toplam Fatura/Sipariş Sayısı)</label>
                                <input type="number" class="form-control" id="Frequency" required placeholder="Örn: 8">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Monetary (Toplam Harcama Tutarı)</label>
                                <input type="number" step="0.01" class="form-control" id="Monetary" required placeholder="Örn: 3500.50">
                            </div>
                        </div>
                        <div class="mt-4 d-grid">
                            <button type="submit" class="btn btn-custom py-2"><i class="fa-solid fa-wand-magic-sparkles"></i> Profili Belirle</button>
                        </div>
                    </form>
                </div>

                <div class="glass-card text-center" id="resultCard">
                    <h5 class="mb-2 text-light opacity-75">Sistem Çıktısı</h5>
                    <h1 id="profileName" class="text-warning fw-bold mb-2"></h1>
                    <p class="mb-0">Algoritma Küme ID: <span id="clusterId" class="badge bg-light text-dark"></span></p>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                Recency: parseInt(document.getElementById('Recency').value),
                Frequency: parseInt(document.getElementById('Frequency').value),
                Monetary: parseFloat(document.getElementById('Monetary').value)
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                document.getElementById('profileName').innerText = result.profile;
                document.getElementById('clusterId').innerText = "#" + result.cluster_id;
                document.getElementById('resultCard').style.display = 'block';

                document.getElementById('resultCard').animate([
                    { transform: 'translateY(20px)', opacity: 0 },
                    { transform: 'translateY(0)', opacity: 1 }
                ], { duration: 400, easing: 'ease-out' });

            } catch (error) {
                alert("Analiz sırasında bir hata oluştu.");
                console.error(error);
            }
        });
    </script>
</body>
</html>
