<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Zeka Müşteri Analizi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 45px;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
        }
        .form-label {
            font-weight: 500;
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: #e0e0e0;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 10px;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.95rem;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: #00d2ff;
            box-shadow: 0 0 0 0.25rem rgba(0, 210, 255, 0.25);
        }
        .btn-custom {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            border-radius: 12px;
            transition: 0.3s;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.45);
            color: white;
        }
        #resultCard {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container-fluid px-4 px-md-5 py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-11 col-xl-10">

                <div class="text-center mb-5">
                    <h1 class="display-6 fw-bold"><i class="fa-solid fa-microchip text-info me-2"></i> Yapay Zeka Müşteri Segmentasyonu</h1>
                    <p class="text-light opacity-75 fs-5">Finansal verileri girerek müşterinin ait olduğu segmenti tahmin edin.</p>
                </div>

                <div class="glass-card mb-4">
                    <form id="predictionForm">
                        <div class="row g-4">
                            <div class="col-md-6 col-lg-4">
                                <label class="form-label">Kredi Limiti</label>
                                <input type="number" step="0.01" class="form-control" id="CREDIT_LIMIT" required placeholder=" Değer giriniz...">
                            </div>
                            <div class="col-md-6 col-lg-4">
                                <label class="form-label">Mevcut Bakiye / Borç</label>
                                <input type="number" step="0.01" class="form-control" id="BALANCE" required placeholder=" Değer giriniz...">
                            </div>
                            <div class="col-md-6 col-lg-4">
                                <label class="form-label">Toplam Alışveriş Tutarı</label>
                                <input type="number" step="0.01" class="form-control" id="PURCHASES" required placeholder=" Değer giriniz...">
                            </div>
                            <div class="col-md-6 col-lg-4">
                                <label class="form-label">Tek Çekim Alışveriş</label>
                                <input type="number" step="0.01" class="form-control" id="ONEOFF_PURCHASES" required placeholder=" Değer giriniz...">
                            </div>
                            <div class="col-md-6 col-lg-4">
                                <label class="form-label">Taksitli Alışveriş</label>
                                <input type="number" step="0.01" class="form-control" id="INSTALLMENTS_PURCHASES" required placeholder=" Değer giriniz...">
                            </div>
                            <div class="col-md-6 col-lg-4">
                                <label class="form-label">Çekilen Nakit Avans</label>
                                <input type="number" step="0.01" class="form-control" id="CASH_ADVANCE" required placeholder=" Değer giriniz...">
                            </div>
                        </div>

                        <div class="mt-5 d-grid col-md-6 mx-auto">
                            <button type="submit" class="btn btn-custom py-3"><i class="fa-solid fa-chart-pie me-2"></i> Segmenti Analiz Et</button>
                        </div>
                    </form>
                </div>

                <!-- Sonuç Kartı -->
                <div class="glass-card text-center" id="resultCard">
                    <h3 class="mb-3">Analiz Sonucu</h3>
                    <h1 id="profileName" class="text-info fw-bold mb-3 display-5"></h1>
                    <p class="text-light opacity-75 fs-5 mb-0">Küme ID: <span id="clusterId" class="badge bg-secondary fs-6 px-3 py-2"></span></p>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                CREDIT_LIMIT: parseFloat(document.getElementById('CREDIT_LIMIT').value),
                BALANCE: parseFloat(document.getElementById('BALANCE').value),
                PURCHASES: parseFloat(document.getElementById('PURCHASES').value),
                ONEOFF_PURCHASES: parseFloat(document.getElementById('ONEOFF_PURCHASES').value),
                INSTALLMENTS_PURCHASES: parseFloat(document.getElementById('INSTALLMENTS_PURCHASES').value),
                CASH_ADVANCE: parseFloat(document.getElementById('CASH_ADVANCE').value)
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                document.getElementById('profileName').innerText = result.profile;
                document.getElementById('clusterId').innerText = "#" + result.cluster_id;
                document.getElementById('resultCard').style.display = 'block';

                document.getElementById('resultCard').animate([
                    { transform: 'scale(0.95)', opacity: 0 },
                    { transform: 'scale(1)', opacity: 1 }
                ], { duration: 300, easing: 'ease-out' });

            } catch (error) {
                alert("Tahmin sırasında bir hata oluştu.");
                console.error(error);
            }
        });
    </script>
</body>
</html>
